name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ principal ]   # ou main, se esse for o nome da sua branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install   # ou bun install, se preferir usar Bun

      - name: Build
        run: npm run build # ou bun run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

